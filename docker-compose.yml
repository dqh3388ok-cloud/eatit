services:
  postgres:
    image: postgres:16
    container_name: eatit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eatit}
      POSTGRES_USER: ${POSTGRES_USER:-eatit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eatit_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: eatit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: eatit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eatitminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eatitminio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
