[package]
name = "eatit-desktop"
version = "0.1.0"
description = "Eatit macOS desktop shell"
authors = ["Eatit Team"]
edition = "2021"

[lib]
name = "eatit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", features = [] }
