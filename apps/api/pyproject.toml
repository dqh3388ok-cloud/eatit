[project]
name = "eatit-api"
version = "0.1.0"
description = "Eatit FastAPI backend scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "langgraph>=0.2.39,<1.0.0",
  "litellm>=1.50.0,<2.0.0",
  "instructor>=1.6.3,<2.0.0",
  "pydantic>=2.9.2,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "alembic>=1.13.3,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "redis>=5.1.1,<6.0.0",
  "celery>=5.4.0,<6.0.0",
  "minio>=7.2.10,<8.0.0",
  "deepgram-sdk>=3.7.7,<4.0.0",
  "langfuse>=2.53.9,<3.0.0",
  "sentry-sdk>=2.17.0,<3.0.0",
  "structlog>=24.4.0,<25.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "httpx>=0.27.2,<1.0.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.3,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.7.0,<1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
