[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///./.data/eatit.db
version_locations = %(here)s/alembic/versions/mainline
# Alembic's default splits `version_locations` on whitespace, which breaks
# when our bundled `.app` sits at a path containing a space (e.g.
# `/Volumes/Eatit 3/Eatit.app/...` while Finder is showing a duplicate
# mount). `os` switches to os.pathsep so single paths are never split.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
